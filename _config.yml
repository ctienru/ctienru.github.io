# Site settings
title: Tien Ru (Terri) Chen
description: Software engineer. Notes on building Podvein, a bilingual podcast search system.
author: Tien Ru (Terri) Chen
# email: your-email@example.com
social:
  name: Tien Ru (Terri) Chen
  links:
    - https://github.com/ctienru

# Build settings
markdown: kramdown
theme: minima

# GitHub Pages settings
url: "https://ctienru.github.io"
baseurl: ""

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
