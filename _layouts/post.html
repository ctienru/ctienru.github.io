---
layout: default
---

<article class="post-content">
    <a href="{{ '/blog' | relative_url }}" class="back-link">← Back to Blog</a>

    <h1>{{ page.title }}</h1>

    <div class="post-meta">
        <time datetime="{{ page.date | date_to_xmlschema }}">
            {{ page.date | date: "%B %d, %Y" }}
        </time>
        {% if page.author %}
        <span> • {{ page.author }}</span>
        {% endif %}
    </div>

    <div class="post-body">
        {{ content }}
    </div>
</article>
